name: Build native iOS app (SwiftUI)
# Быстрый путь на каждый push (16.11.2026): компиляция Release + IPA и модульные тесты — два задания
# параллельно, ответ за минуты. Снимки экранов и XCUITest (~25 мин) — только по запросу:
# ручной запуск (Run workflow) или «[full]» в сообщении коммита.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Снимки экранов и UI-тесты (XCUITest)'
        type: boolean
        default: true
  push:
    paths:
      - 'ios-native/**'
      - '.github/workflows/build-ios-native.yml'
      - '.github/actions/setup-native/**'
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Release + IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - name: Verify free-account compatibility
        run: |
          set -euo pipefail
          # Бесплатный Apple ID: одно приложение, без расширений и платных возможностей.
          if find ios-native -name '*.entitlements' -o -name '*.appex' | grep -q .; then
            echo 'Entitlements or extensions are not allowed'; exit 1
          fi
          test "$(grep -c 'com.apple.product-type.application"' ios-native/LLMChat.xcodeproj/project.pbxproj)" -ge 1
          if grep -q 'com.apple.product-type.app-extension' ios-native/LLMChat.xcodeproj/project.pbxproj; then
            echo 'App extensions are not allowed'; exit 1
          fi
      - name: Compile unsigned Release
        run: |
          set -euo pipefail
          xcodebuild -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build > build-ios-native.log 2>&1 || { grep -E 'error:|warning: unre|FAILED' build-ios-native.log | head -n 80; exit 1; }
      - name: Package IPA
        run: |
          set -euo pipefail
          app=build/ios/Build/Products/Release-iphoneos/LLMChat.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = app.llmchat.native
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Info.plist")"
          test -f "$app/LLMChat"
          # Движок моделей на телефоне: фреймворк внутри и бинарник с ним действительно скомпонован.
          test -f "$app/Frameworks/llama.framework/llama"
          otool -L "$app/LLMChat" | grep -q 'llama.framework/llama'
          test ! -e "$app/_CodeSignature"
          test -z "$(find "$app" -name '*.appex' -o -name '*.mobileprovision')"
          mkdir -p build/package/Payload
          ditto "$app" build/package/Payload/LLMChat.app
          cd build/package
          zip -qry ../LLM-Chat-native-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LLM-Chat-native-unsigned
          path: build/LLM-Chat-native-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-native-build-log
          path: build-ios-native.log
          if-no-files-found: ignore

  unit:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - name: Unit tests (LLMChatTests) in simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcodebuild test -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/unit \
            -only-testing:LLMChatTests CODE_SIGNING_ALLOWED=NO > build-unit.log 2>&1 \
            || { grep -E 'error:|Test Case .* failed|XCTAssert' build-unit.log | tail -n 60; exit 1; }
          grep -E 'Executed [0-9]+ test' build-unit.log | tail -n 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-native-unit-log
          path: build-unit.log
          if-no-files-found: ignore

  ui:
    name: Screens + UI tests
    needs: build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.head_commit.message, '[full]') }}
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native
      - name: Keyboard tests first (fast check)
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          for domain in com.apple.Preferences com.apple.keyboard.preferences com.apple.keyboard.ContinuousPath; do
            xcrun simctl spawn "$device" defaults write "$domain" DidShowContinuousPathIntroduction -bool true || true
            xcrun simctl spawn "$device" defaults write "$domain" KeyboardContinuousPathEnabled -bool false || true
          done
          # Сначала — тесты капсулы над клавиатурой: ответ за минуты, а не после 14 минут снимков.
          mkdir -p build/quick-screens
          export TEST_RUNNER_SCREENS_DIR="$PWD/build/quick-screens"
          xcodebuild test -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Debug             -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/uitest             -only-testing:LLMChatUITests/ComposerUITests/testQueue             -only-testing:LLMChatUITests/ComposerUITests/testCardWithoutContextLine             -only-testing:LLMChatUITests/PhoneModelsUITests/testPhoneChat             -only-testing:LLMChatUITests/PhoneSettingsUITests/testOffline             CODE_SIGNING_ALLOWED=NO > build-quick.log 2>&1             || { grep -E 'error:|Test Case .* failed|hit point' build-quick.log | tail -n 30; exit 1; }
          grep -E 'Test Case .*(passed|failed)' build-quick.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-keyboard-check
          path: |
            build/quick-screens
            build-quick.log
          if-no-files-found: warn
      - name: Capture screens in simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > build-simulator.log 2>&1
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark || true
          # Свежий симулятор при первой клавиатуре показывает подсказку «Speed up your typing…»
          # поверх поля ввода — автотесты не могли нажать «Отправить» (сборка №1 на GitHub, 13.11.2026).
          for domain in com.apple.Preferences com.apple.keyboard.preferences com.apple.keyboard.ContinuousPath; do
            xcrun simctl spawn "$device" defaults write "$domain" DidShowContinuousPathIntroduction -bool true || true
            xcrun simctl spawn "$device" defaults write "$domain" KeyboardContinuousPathEnabled -bool false || true
          done
          xcrun simctl install "$device" build/simulator/Build/Products/Debug-iphonesimulator/LLMChat.app
          mkdir -p build/screens
          # Имена экранов — PreviewScene в ios-native/Sources/Core/PreviewScene.swift; данные вымышленные.
          for scene in connect login offline chat sidebar thread threadTop streaming models media parameters nano settings branches memory knowledge omni studio studioSettings studioHistory studioArt phoneModels phoneChat phoneSettings phoneParameters phoneOffline tools queue recents light settingsLight computer modelProfile; do
            xcrun simctl terminate "$device" app.llmchat.native || true
            xcrun simctl launch "$device" app.llmchat.native "--preview=$scene"
            sleep 4
            xcrun simctl io "$device" screenshot "build/screens/$scene.png"
          done
      - name: UI tests (XCUITest) in simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          mkdir -p build/uitest-screens
          # TEST_RUNNER_* передаётся тестам без приставки: снимки шагов пишутся прямо в папку.
          export TEST_RUNNER_SCREENS_DIR="$PWD/build/uitest-screens"
          xcodebuild test -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Debug             -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/uitest             -only-testing:LLMChatUITests             -resultBundlePath build/uitest.xcresult CODE_SIGNING_ALLOWED=NO > build-uitest.log 2>&1             || { grep -E 'error:|failed|Failing|XCTAssert|Test Case .* failed' build-uitest.log | tail -n 60; status=1; }
          grep -E 'Test Case .*(passed|failed)|Executed [0-9]+ test' build-uitest.log | tail -n 20 || true
          if [ -z "$(ls build/uitest-screens)" ]; then
            xcrun xcresulttool export attachments --path build/uitest.xcresult --output-path build/uitest-screens || true
          fi
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screens
          path: |
            build/screens
            build/uitest-screens
            build-simulator.log
            build-uitest.log
          if-no-files-found: warn
