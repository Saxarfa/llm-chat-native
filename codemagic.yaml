workflows:
  ios-native:
    name: Build native iOS app (SwiftUI)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: native-swiftui
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Fetch llama.cpp (iOS xcframework)
        script: |
          set -euo pipefail
          tag=b11870
          sum=5206da648efdb196350da7d6dad2edf34a4290cdbe93c27680ce025f273567e3
          tmp="$(mktemp -d)"
          curl -sSfL -o "$tmp/llama.zip" "https://github.com/ggml-org/llama.cpp/releases/download/$tag/llama-$tag-xcframework.zip"
          echo "$sum  $tmp/llama.zip" | shasum -a 256 -c -
          mkdir -p "$tmp/llama"
          unzip -q "$tmp/llama.zip" -d "$tmp/llama"
          framework=$(find "$tmp/llama" -maxdepth 4 -type d -name llama.xcframework | head -n 1)
          test -n "$framework"
          rm -rf ios-native/Frameworks && mkdir -p ios-native/Frameworks/iphoneos
          cp -R "$framework/ios-arm64/llama.framework" ios-native/Frameworks/iphoneos/
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          brew install xcodegen
          cd ios-native
          xcodegen generate
          xcodebuild -version
      - name: Verify free-account compatibility
        script: |
          set -euo pipefail
          if find ios-native -name '*.entitlements' -o -name '*.appex' | grep -q .; then
            echo 'Entitlements or extensions are not allowed'; exit 1
          fi
          if grep -q 'com.apple.product-type.app-extension' ios-native/LLMChat.xcodeproj/project.pbxproj; then
            echo 'App extensions are not allowed'; exit 1
          fi
      - name: Compile unsigned Release
        script: |
          set -euo pipefail
          xcodebuild -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build > build-ios-native.log 2>&1 || { grep -E 'error:|warning: unre|FAILED' build-ios-native.log | head -n 80; exit 1; }
      - name: Package IPA
        script: |
          set -euo pipefail
          app=build/ios/Build/Products/Release-iphoneos/LLMChat.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = app.llmchat.native
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Info.plist")"
          test -f "$app/LLMChat"
          test -f "$app/Frameworks/llama.framework/llama"
          otool -L "$app/LLMChat" | grep -q 'llama.framework/llama'
          test ! -e "$app/_CodeSignature"
          test -z "$(find "$app" -name '*.appex' -o -name '*.mobileprovision')"
          mkdir -p build/package/Payload
          ditto "$app" build/package/Payload/LLMChat.app
          cd build/package
          zip -qry ../LLM-Chat-native-unsigned.ipa Payload
      - name: Capture screens in simulator
        script: |
          set -euo pipefail
          xcodebuild -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > build-simulator.log 2>&1
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark || true
          xcrun simctl install "$device" build/simulator/Build/Products/Debug-iphonesimulator/LLMChat.app
          mkdir -p build/screens
          for scene in connect login offline chat sidebar thread threadTop streaming models media parameters nano settings branches memory knowledge omni studio studioSettings studioHistory studioArt phoneModels phoneChat phoneSettings phoneParameters phoneOffline tools queue recents light settingsLight computer modelProfile; do
            xcrun simctl terminate "$device" app.llmchat.native || true
            xcrun simctl launch "$device" app.llmchat.native "--preview=$scene"
            sleep 4
            xcrun simctl io "$device" screenshot "build/screens/$scene.png"
          done
      - name: UI tests (XCUITest) in simulator
        # Падение тестов не должно терять IPA и снимки: итог проверяется последним шагом.
        script: |
          set +e
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          mkdir -p build/uitest-screens
          export TEST_RUNNER_SCREENS_DIR="$PWD/build/uitest-screens"
          xcodebuild test -project ios-native/LLMChat.xcodeproj -scheme LLMChat -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/uitest \
            -resultBundlePath build/uitest.xcresult CODE_SIGNING_ALLOWED=NO > build-uitest.log 2>&1
          echo $? > build/uitest.status
          grep -E 'error:|failed|Failing|XCTAssert|Test Case .* failed' build-uitest.log | tail -n 60
          grep -E 'Test Case .*(passed|failed)|Executed [0-9]+ test' build-uitest.log | tail -n 20
          if [ -z "$(ls build/uitest-screens)" ]; then
            xcrun xcresulttool export attachments --path build/uitest.xcresult --output-path build/uitest-screens || true
          fi
          exit 0
      - name: Report UI tests result
        script: |
          test "$(cat build/uitest.status)" = 0
    artifacts:
      - build/LLM-Chat-native-unsigned.ipa
      - build/screens/*.png
      - build/uitest-screens/**
      - build-simulator.log
      - build-uitest.log
      - build-ios-native.log
