<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"><title>Проверка ввода — обычные поля</title><style>
html{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif}body{margin:0;padding:12px;max-width:600px}label{display:block;margin:0 0 6px}label+input{margin-bottom:18px}input,textarea{box-sizing:border-box;display:block;width:100%;font:400 16px/24px system-ui,sans-serif;padding:8px;border:1px solid #888;border-radius:6px;background:transparent;color:inherit}input{height:44px}textarea{height:92px;resize:none;field-sizing:fixed}
</style></head><body><label for="check-line">1. Обычная строка</label><input id="check-line" type="text" aria-label="Обычная строка" autocorrect="on" autocomplete="on" spellcheck="true"><label for="check-area">2. Многострочное поле</label><textarea id="check-area" rows="2" aria-label="Многострочное поле" autocorrect="on" autocomplete="on" spellcheck="true"></textarea></body></html>
