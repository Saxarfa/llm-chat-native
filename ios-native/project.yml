# Проект Xcode создаётся из этого файла командой `xcodegen generate` (на Mac в GitHub Actions).
# Сам .xcodeproj в репозитории не хранится.
name: LLMChat
options:
  bundleIdPrefix: app.llmchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LLMChat:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmchat.native
        PRODUCT_NAME: LLMChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LLM Chat
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSLocalNetworkUsageDescription: LLM Chat подключается к вашему компьютеру в локальной сети для чатов и генерации.
        NSCameraUsageDescription: Камера нужна, чтобы прикрепить снимок к сообщению.
        NSPhotoLibraryAddUsageDescription: Доступ нужен, чтобы сохранять изображения из чата в «Фото».
        # Сервер — личный ПК в домашней сети или Tailscale, обычно по http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
