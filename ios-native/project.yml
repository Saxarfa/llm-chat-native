# Проект Xcode создаётся из этого файла командой `xcodegen generate` (на Mac в GitHub Actions).
# Сам .xcodeproj в репозитории не хранится.
name: LLMChat
options:
  bundleIdPrefix: app.llmchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.14.3"
    CURRENT_PROJECT_VERSION: "24"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LLMChat:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - LLMChatTests
        - LLMChatUITests
    sources:
      - path: Sources
      - path: Resources
    # llama.cpp для моделей на телефоне: workflow кладёт слой устройства из релиза в
    # Frameworks/iphoneos. Слоя симулятора в релизе нет — там движок не подключается (заглушка в коде).
    postBuildScripts:
      - name: Embed llama.framework (device)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            rsync -a --delete "$PROJECT_DIR/Frameworks/iphoneos/llama.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmchat.native
        PRODUCT_NAME: LLMChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Frameworks/iphoneos"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -framework llama"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LLM Chat
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSLocalNetworkUsageDescription: LLM Chat подключается к вашему компьютеру в локальной сети для чатов и генерации.
        NSCameraUsageDescription: Камера нужна, чтобы прикрепить снимок к сообщению.
        NSPhotoLibraryAddUsageDescription: Доступ нужен, чтобы сохранять изображения из чата в «Фото».
        NSPhotoLibraryUsageDescription: Последние снимки показываются в меню «+», чтобы прикрепить их одним нажатием.
        NSMicrophoneUsageDescription: Микрофон нужен для диктовки сообщения.
        NSSpeechRecognitionUsageDescription: Речь превращается в текст сообщения средствами iOS.
        # Сервер — личный ПК в домашней сети или Tailscale, обычно по http.
        # Только NSAllowsArbitraryLoads: рядом с NSAllowsLocalNetworking iOS его игнорирует,
        # и http остаётся разрешён лишь к локальной сети — адреса Tailscale 100.x блокируются.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # Автотесты с нажатиями (XCUITest) — запускаются в симуляторе в workflow, в IPA не попадают.
  LLMChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LLMChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmchat.native.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: LLMChat
  # Проверки логики без интерфейса (разбор ответов сервера) — тоже только в workflow.
  LLMChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LLMChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmchat.native.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LLMChat.app/LLMChat
        BUNDLE_LOADER: $(TEST_HOST)
