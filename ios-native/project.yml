# Проект Xcode создаётся из этого файла командой `xcodegen generate` (на Mac в GitHub Actions).
# Сам .xcodeproj в репозитории не хранится.
name: LLMChat
options:
  bundleIdPrefix: app.llmchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8"
    CURRENT_PROJECT_VERSION: "12"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LLMChat:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - LLMChatTests
        - LLMChatUITests
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      # llama.cpp для моделей на телефоне: workflow скачивает готовый xcframework из релиза.
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmchat.native
        PRODUCT_NAME: LLMChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LLM Chat
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSLocalNetworkUsageDescription: LLM Chat подключается к вашему компьютеру в локальной сети для чатов и генерации.
        NSCameraUsageDescription: Камера нужна, чтобы прикрепить снимок к сообщению.
        NSPhotoLibraryAddUsageDescription: Доступ нужен, чтобы сохранять изображения из чата в «Фото».
        # Сервер — личный ПК в домашней сети или Tailscale, обычно по http.
        # Только NSAllowsArbitraryLoads: рядом с NSAllowsLocalNetworking iOS его игнорирует,
        # и http остаётся разрешён лишь к локальной сети — адреса Tailscale 100.x блокируются.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  # Автотесты с нажатиями (XCUITest) — запускаются в симуляторе в workflow, в IPA не попадают.
  LLMChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LLMChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmchat.native.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: LLMChat
  # Проверки логики без интерфейса (разбор ответов сервера) — тоже только в workflow.
  LLMChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LLMChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.llmchat.native.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LLMChat.app/LLMChat
        BUNDLE_LOADER: $(TEST_HOST)
